<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>网站停留时间</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      width: 320px;
      min-height: 200px;
      background: linear-gradient(165deg, #f8f9fc 0%, #eef1f8 100%);
      color: #18191c;
    }

    .view {
      display: none;
      padding: 14px 16px 16px;
      animation: fadeIn 0.2s ease;
    }
    .view.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: 0.02em;
      flex: 1;
      min-width: 0;
    }

    .header--add h1 {
      text-align: center;
      font-size: 14px;
    }

    .icon-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(51, 102, 255, 0.2);
    }

    .icon-btn:active { transform: translateY(0); }

    .icon-btn--add {
      background: linear-gradient(135deg, #4d7cff 0%, #3366ff 100%);
      color: #fff;
      font-weight: 600;
    }

    .icon-btn--back {
      background: #fff;
      color: #3366ff;
      border: 1px solid #d8dff0;
      font-size: 16px;
    }

    .date-label {
      font-size: 11px;
      color: #7a8194;
      margin-bottom: 10px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 2px 8px rgba(30, 40, 90, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 10px;
      margin-bottom: 8px;
      border-bottom: 1px dashed #e8ecf4;
    }

    .total-label { font-size: 12px; color: #61666d; }
    .total-time {
      font-size: 22px;
      font-weight: 700;
      color: #3366ff;
      font-variant-numeric: tabular-nums;
    }

    .site-list-scroll {
      max-height: 240px;
      overflow-y: auto;
      overflow-x: hidden;
      margin: 0 -2px;
      padding: 0 2px;
      scrollbar-width: thin;
      scrollbar-color: #b8c4e8 #f0f2f7;
    }

    .site-list-scroll::-webkit-scrollbar { width: 6px; }
    .site-list-scroll::-webkit-scrollbar-thumb {
      background: #b8c4e8;
      border-radius: 6px;
    }
    .site-list-scroll::-webkit-scrollbar-track {
      background: #f0f2f7;
      border-radius: 6px;
    }

    #site-list.loading,
    #site-list.empty {
      color: #9499a0;
      font-size: 13px;
      padding: 8px 0;
      line-height: 1.5;
    }

    .site-row-wrap {
      position: relative;
      overflow: hidden;
      margin: 6px 0;
      border-radius: 14px;
    }

    .site-row-actions {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 156px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding-right: 6px;
      z-index: 0;
    }

    .action-btn {
      flex: 0 0 auto;
      height: 32px;
      padding: 0 13px;
      border: none;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(30, 40, 90, 0.08);
      transition: transform 0.12s, box-shadow 0.15s, filter 0.15s;
    }

    .action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(30, 40, 90, 0.12);
    }

    .action-btn:active { transform: translateY(0); }

    .action-btn--rename {
      background: linear-gradient(180deg, #f0f4ff 0%, #e4ebff 100%);
      color: #3366ff;
    }

    .action-btn--delete {
      background: linear-gradient(180deg, #fff0f0 0%, #ffe4e4 100%);
      color: #d14040;
    }

    .site-row-panel {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 4px 8px 0;
      font-size: 13px;
      background: #fff;
      border-radius: 14px;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    .site-row-wrap.is-open .site-row-panel {
      transform: translateX(-156px);
    }

    .site-row-main {
      flex: 1;
      min-width: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .site-name {
      color: #18191c;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .site-time {
      flex-shrink: 0;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #3366ff;
    }

    .btn-more {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: #f4f6fb;
      color: #61666d;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-more:hover {
      background: #e8ecf8;
      color: #3366ff;
    }

    .site-row-wrap.is-open .btn-more {
      background: #e8ecf8;
      color: #3366ff;
    }

    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: #7a8194;
      line-height: 1.55;
    }

    .field { margin-bottom: 14px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #4a5068;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid #d8dff0;
      border-radius: 10px;
      background: #fff;
      color: #18191c;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field input:focus {
      border-color: #3366ff;
      box-shadow: 0 0 0 3px rgba(51, 102, 255, 0.15);
    }

    .field input::placeholder { color: #aab0c0; }

    .error-msg {
      min-height: 18px;
      font-size: 12px;
      color: #e85d5d;
      margin: 4px 0 10px;
    }

    .btn-row { margin-top: 4px; }

    .btn {
      width: 100%;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s, opacity 0.15s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn--primary {
      background: linear-gradient(135deg, #4d7cff 0%, #3366ff 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(51, 102, 255, 0.35);
    }

    .btn--primary:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(51, 102, 255, 0.4);
    }

    .add-hint {
      font-size: 11px;
      color: #7a8194;
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .permission-card {
      display: none;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #f4f7ff 0%, #eef2fc 100%);
      border: 1px solid #d8e2ff;
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(51, 102, 255, 0.08);
    }

    .permission-card.is-visible { display: flex; }

    .permission-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 2px 8px rgba(51, 102, 255, 0.12);
    }

    .permission-body { flex: 1; min-width: 0; }

    .permission-body strong {
      display: block;
      font-size: 12px;
      color: #4a5068;
      margin-bottom: 4px;
    }

    .permission-host {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #3366ff;
      word-break: break-all;
      margin-bottom: 6px;
    }

    .permission-note {
      font-size: 11px;
      color: #7a8194;
      line-height: 1.5;
    }

    .btn--grant {
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div id="view-main" class="view active">
    <header class="header">
      <h1>今日网站停留时间</h1>
      <button type="button" id="btn-open-add" class="icon-btn icon-btn--add" title="添加追踪网址" aria-label="添加追踪网址">+</button>
    </header>
    <p id="date-label" class="date-label">—</p>
    <div class="card">
      <div class="total-row">
        <span class="total-label">合计</span>
        <span id="total" class="total-time">—</span>
      </div>
      <div class="site-list-scroll" id="site-list-scroll">
        <div id="site-list" class="loading">加载中…</div>
      </div>
    </div>
    <p class="hint">数据保存在本机；每日 0:00 清零。点击 + 添加；点击 ··· 可重命名或删除。</p>
  </div>

  <div id="view-add" class="view">
    <header class="header header--add">
      <button type="button" id="btn-back" class="icon-btn icon-btn--back" title="返回" aria-label="返回">←</button>
      <h1>添加追踪网址</h1>
      <span class="icon-btn" style="visibility:hidden" aria-hidden="true"></span>
    </header>
    <p class="add-hint">粘贴完整链接或域名即可，将自动按整站统计（路径会归纳为域名）。</p>
    <div class="field">
      <label for="input-url">网址</label>
      <input id="input-url" type="url" placeholder="https://www.zhihu.com/..." autocomplete="off" spellcheck="false" />
    </div>
    <div class="field">
      <label for="input-name">显示名称（可选）</label>
      <input id="input-name" type="text" placeholder="例如：知乎" maxlength="32" />
    </div>
    <div id="permission-card" class="permission-card">
      <div class="permission-icon" aria-hidden="true">🔒</div>
      <div class="permission-body">
        <strong>需要授权访问</strong>
        <span id="permission-host" class="permission-host">—</span>
        <p class="permission-note">首次添加需授权一次；之后添加新站点无需再弹 Firefox 权限框。</p>
      </div>
    </div>
    <p id="add-error" class="error-msg"></p>
    <div class="btn-row">
      <button type="button" id="btn-confirm-add" class="btn btn--primary btn--grant" disabled>授予权限并添加</button>
    </div>
  </div>

  <script src="sites.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
